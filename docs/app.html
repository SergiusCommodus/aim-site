<style>
/* AIM brand system. White base, AIM navy (#183364) as the accent and header color. Single light theme by design. */
:root{
  --paper:#FFFFFF; --panel:#FFFFFF; --wash:#F5F7FB; --ink:#0F1E3A; --muted:#55617A; --faint:#7A859B; --line:#DDE3EC; --line-2:#C8D1DF;
  --accent:#183364; --tint:#EDF1F8; --tint-2:#DCE5F3; --navy:#183364; --navy-deep:#102650;
  --on-navy:#FFFFFF; --on-navy-muted:#B8C5DE; --sky:#9DB9EA;
  --good:#1E7A4C; --good-bg:#E5F3EB; --warn:#9A5B0E; --warn-bg:#FBF0DF; --bad:#B23434; --bad-bg:#FBE7E7;
  --c1:#2F5DAA; --c2:#4FA3E0; --c3:#C9902A; --c4:#1F9E89; --c5:#9B5BB4; --c6:#C2602F;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(15,30,58,.06),0 8px 24px -16px rgba(15,30,58,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);margin:0}
h1,h2,h3,h4{font-family:var(--display);font-stretch:112%;text-wrap:balance;margin:0;line-height:1.1}
h1,h2{font-style:italic;font-weight:800;letter-spacing:-.01em}
h3{font-weight:700}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.num,.tab-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--on-navy)}
.brand img{height:24px;width:auto;display:block}
.brand small{font:400 12px/1.2 var(--body);color:var(--on-navy-muted);padding-left:12px;border-left:1px solid rgba(255,255,255,.22)}
.topnav{display:flex;align-items:center;gap:22px}
.topnav a{color:var(--on-navy-muted);text-decoration:none;font-size:14px}
.topnav a:hover,.topnav a[aria-current="page"]{color:var(--on-navy)}
@media (max-width:820px){.topnav a.hide-sm{display:none}}
@media (max-width:440px){.brand small{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 15px/1 var(--body);padding:12px 18px;border-radius:6px;text-decoration:none;background:var(--navy);color:var(--on-navy);white-space:nowrap}
.btn:hover{background:var(--navy-deep);color:var(--on-navy)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--navy);color:var(--navy)}
.btn.light{background:var(--on-navy);color:var(--navy)}
.btn.light:hover{background:var(--sky);color:var(--navy)}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);color:#fff}
.btn.link{background:none;color:var(--accent);padding:6px 4px;font-weight:500}
.btn.link:hover{text-decoration:underline;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
label{font-size:13.5px;color:var(--muted)}
input,select,textarea{font:400 15px/1.3 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tint-2);border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--navy)}
input[type=range]{padding:0;border:0;accent-color:var(--navy)}

/* tags and pills */
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--tint);color:var(--accent);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--tint);color:var(--accent)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.footer{border-top:1px solid var(--line);padding-block:32px 40px;font-size:13.5px;color:var(--muted)}
.footer .f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.footer nav{display:flex;flex-wrap:wrap;gap:18px}
.footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App layout: navy top bar, left rail navigation on white, content column. Rail becomes a scrolling tab row on phones. */
html,body{height:100%}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);background:var(--wash);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px);overflow:auto}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:500}
.rail a svg{width:18px;height:18px;flex:none}
.rail a:hover{background:var(--tint);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--paper);color:var(--navy);box-shadow:inset 3px 0 0 var(--navy),0 1px 2px rgba(15,30,58,.08)}
.rail .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--faint);line-height:1.5}
.main{min-width:0;padding:28px 32px 64px}
.ws{display:flex;align-items:center;gap:10px;color:var(--on-navy-muted);font-size:13.5px}
.ws .who{display:flex;align-items:center;gap:8px}
.ws .av{width:30px;height:30px;border-radius:50%;background:var(--on-navy);color:var(--navy);display:grid;place-items:center;font:700 13px var(--body)}
.sample{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.12);color:var(--on-navy);padding:6px 8px;border-radius:4px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail a{white-space:nowrap;padding:8px 10px;font-size:14px}
  .rail a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--navy)}
  .rail .sep,.rail .foot{display:none}
  .main{padding:20px 16px 56px}
  .ws .wsname{display:none}
}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.ph h1{font-size:clamp(26px,3vw,34px)}
.ph p{color:var(--muted);margin-top:6px}
.ph .actions{display:flex;flex-wrap:wrap;gap:8px}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>header h2,.card>header h3{font-size:16px;font-style:normal;font-weight:700;letter-spacing:0}
.card .body{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split-r{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* kpi */
.kpi{padding:16px 18px}
.kpi>small{display:block;font-size:13px;color:var(--muted)}
.kpi>strong{display:block;font:500 26px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;color:var(--ink)}
.kpi>span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--navy);border-color:var(--navy)}
.kpi.hero>small,.kpi.hero>span{color:var(--on-navy-muted)}
.kpi.hero>strong{color:var(--on-navy)}
.up{color:var(--good)}.dn{color:var(--bad)}
.kpi.hero .up{color:#9FE0BC}.kpi.hero .dn{color:#F4B1B1}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--wash)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--wash)}
tr.sub td{font-weight:600;background:var(--wash)}
tr.total td{font-weight:700;border-top:2px solid var(--navy)}
td input,td select{padding:7px 8px;font-size:14px}
.best{background:var(--good-bg)!important;color:var(--good);font-weight:600}

/* opportunity list */
.oname{display:flex;flex-direction:column;gap:2px;min-width:0}
.oname b{font-weight:600;color:var(--ink)}
.oname span{font-size:12.5px;color:var(--muted)}
.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font:600 14px var(--mono);border:3px solid currentColor}
.score.s-strong{color:var(--good)}.score.s-workable{color:var(--navy)}.score.s-marginal{color:var(--warn)}.score.s-weak{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--paper);color:var(--muted);border-radius:999px;padding:7px 12px;font:500 13.5px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* analyzer */
.an{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.an{grid-template-columns:1fr}}
.inputs{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1000px){.inputs{position:static;max-height:none}}
fieldset{border:0;padding:14px 18px;margin:0;border-bottom:1px solid var(--line)}
fieldset:last-child{border-bottom:0}
legend{font:500 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0;margin-bottom:10px;float:left;width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;clear:both}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.f label em{font-style:normal;color:var(--faint)}
.inwrap{position:relative}
.inwrap input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.inwrap.pre input{padding-left:22px}
.inwrap.post input{padding-right:34px}
.inwrap .u{position:absolute;top:50%;transform:translateY(-50%);font:400 13px var(--mono);color:var(--faint);pointer-events:none}
.inwrap.pre .u{left:10px}.inwrap.post .u{right:10px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:20px}
.dial{width:112px;height:112px}
.verdict h2{font-size:22px;font-style:normal;font-weight:800}
.verdict p{margin-top:6px;color:var(--ink)}
.verdict .tp{margin-top:10px;font-size:14px;color:var(--muted)}
.verdict .tp b{color:var(--navy);font-family:var(--mono)}
@media (max-width:520px){.verdict{grid-template-columns:1fr}}
.parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
.part{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.part:last-child{border-right:0}
.part small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part b{font:500 14px var(--mono)}
.meter{height:5px;border-radius:3px;background:var(--tint);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy);border-radius:3px}
@media (max-width:700px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}.part{border-bottom:1px solid var(--line)}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.m{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.m:nth-child(4n){border-right:0}
.m>small{display:block;font-size:12.5px;color:var(--muted)}
.m>strong{display:block;font:500 19px/1.3 var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.m>span{display:block;font-size:11.5px;color:var(--faint)}

/* demo ribbon */

.starter p{color:var(--muted);font-size:14.5px}
.starter-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sbtn{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line-2);border-radius:10px;padding:14px;background:var(--paper);cursor:pointer;font:inherit;color:var(--ink)}
.sbtn:hover{border-color:var(--navy);background:var(--tint)}
.sbtn b{font-size:14.5px}.sbtn span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.starter-btns{grid-template-columns:1fr}}
.alloc.tall{height:22px;border-radius:6px}
.legend i.dash{background:none!important;border-top:2px dashed;height:0;width:14px;border-radius:0}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.hb{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr minmax(110px,auto);gap:12px;align-items:center;font-size:13.5px}
.hb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
.hbt i{display:block;height:100%;background:var(--c1);border-radius:5px}
.hb .num{text-align:right;white-space:nowrap}.hb em{font-style:normal;color:var(--faint);font-size:12px;margin-left:4px}
@media (max-width:560px){.hb{grid-template-columns:1fr 1fr}.hb .hbt{grid-column:1/-1;order:3}}
.keys{display:flex;flex-direction:column;gap:10px;font-size:14px}
.keys kbd{margin-right:4px}
.btn.danger-ghost{color:var(--bad)}.btn.danger-ghost:hover{box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}

/* command palette */
.modal.palm{max-width:620px;align-self:start;margin-top:10vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:18px;height:18px;color:var(--muted);flex:none}
.pal-in input{border:0;padding:6px 0;font-size:16px;outline:none!important}
#palList{list-style:none;margin:0;padding:6px;max-height:min(55vh,460px);overflow:auto}
#palList li[role=option]{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}
#palList li[role=option] small{color:var(--faint);font-size:12.5px}
#palList li[aria-selected="true"]{background:var(--tint);color:var(--navy)}
#palList .pg{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 12px 6px}
@media print{.ribbon{display:none!important}}
.sh em{display:block;text-transform:none;letter-spacing:0;font-family:var(--body);margin-top:6px;font-size:13px}
.f .hint{font-size:12px;color:var(--faint)}
.inwrap input::-webkit-outer-spin-button,.inwrap input::-webkit-inner-spin-button,td input[type=number]::-webkit-inner-spin-button,td input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inwrap input[type=number],td input[type=number]{-moz-appearance:textfield;appearance:textfield}
@media (max-width:640px){
  .ribbon .rb-txt{display:none}
  .ribbon{justify-content:space-between}
  .g4{grid-template-columns:1fr 1fr}
  .kpi{padding:12px 14px}
  .kpi>strong{font-size:19px;white-space:normal;overflow-wrap:anywhere}
  .kpi>span{font-size:12px}
  .fg.one-sm{grid-template-columns:1fr}
}

</style>

<script>
/* AIM financial engine. Pure functions, no DOM. The model calculates; the UI and AIMBot only explain. */
var AIM = (function () {
  "use strict";

  function num(v, d) { v = +v; return isFinite(v) ? v : (d || 0); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  var Fin = {
    pmt: function (loan, ratePct, years) {
      var r = ratePct / 1200, n = Math.round(years * 12);
      if (loan <= 0 || n <= 0) return 0;
      return r === 0 ? loan / n : loan * r / (1 - Math.pow(1 + r, -n));
    },
    balance: function (loan, ratePct, years, months) {
      if (loan <= 0) return 0;
      var r = ratePct / 1200, n = Math.round(years * 12), p = Fin.pmt(loan, ratePct, years);
      months = Math.min(months, n);
      if (r === 0) return Math.max(0, loan - p * months);
      return Math.max(0, loan * Math.pow(1 + r, months) - p * (Math.pow(1 + r, months) - 1) / r);
    },
    npv: function (rate, flows) {
      var s = 0;
      for (var t = 0; t < flows.length; t++) s += flows[t] / Math.pow(1 + rate, t);
      return s;
    },
    irr: function (flows) {
      var lo = -0.99, hi = 2, flo = Fin.npv(lo, flows), fhi = Fin.npv(hi, flows);
      if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
      for (var i = 0; i < 120; i++) {
        var mid = (lo + hi) / 2, fm = Fin.npv(mid, flows);
        if (fm * flo > 0) { lo = mid; flo = fm; } else { hi = mid; }
      }
      return (lo + hi) / 2;
    },
    /* largest x in [lo,hi] where ok(x) holds; ok must be true at low x and false at high x */
    maxWhere: function (ok, lo, hi) {
      if (!ok(lo)) return null;
      if (ok(hi)) return hi;
      for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; }
      return lo;
    },
    /* smallest x in [lo,hi] where ok(x) holds; ok false at low x, true at high x */
    minWhere: function (ok, lo, hi) {
      if (!ok(hi)) return null;
      if (ok(lo)) return lo;
      for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (ok(m)) hi = m; else lo = m; }
      return hi;
    }
  };

  /* ---------- Long term rental ---------- */
  var RENTAL_DEFAULTS = {
    price: 285000, closing: 8500, repairs: 6000, down: 25, rate: 7, term: 30,
    rent: 2450, other: 0, vacancy: 6, rentGrowth: 3,
    taxes: 4100, insurance: 1700, hoa: 0, utilities: 0, otherExp: 0,
    mgmt: 8, maint: 5, capex: 5, expGrowth: 3, appreciation: 3
  };

  function rental(raw) {
    var i = {}; for (var k in RENTAL_DEFAULTS) i[k] = num(raw[k], RENTAL_DEFAULTS[k]);
    var downAmt = i.price * i.down / 100, loan = i.price - downAmt;
    var pm = Fin.pmt(loan, i.rate, i.term), ds = pm * 12;
    var gross = (i.rent + i.other) * 12, vac = gross * i.vacancy / 100, egi = gross - vac;
    var mgmt = egi * i.mgmt / 100, maint = gross * i.maint / 100, capex = gross * i.capex / 100;
    var fixed = i.taxes + i.insurance + (i.hoa + i.utilities + i.otherExp) * 12;
    var opex = fixed + mgmt + maint + capex, noi = egi - opex, cf = noi - ds;
    var cash = downAmt + i.closing + i.repairs;
    var beDen = gross * (1 - i.mgmt / 100);
    var beOcc = beDen > 0 ? (fixed + maint + capex + ds) / beDen : Infinity;

    /* five year hold */
    var years = [], bal = loan, flows = [-cash];
    for (var y = 1; y <= 5; y++) {
      var g = Math.pow(1 + i.rentGrowth / 100, y - 1), e = Math.pow(1 + i.expGrowth / 100, y - 1);
      var gy = gross * g, egiY = gy * (1 - i.vacancy / 100);
      var opY = fixed * e + egiY * i.mgmt / 100 + gy * (i.maint + i.capex) / 100;
      var noiY = egiY - opY, cfY = noiY - ds;
      bal = Fin.balance(loan, i.rate, i.term, y * 12);
      var val = i.price * Math.pow(1 + i.appreciation / 100, y);
      years.push({ year: y, noi: noiY, cf: cfY, balance: bal, value: val, equity: val - bal });
      flows.push(cfY);
    }
    var last = years[4], saleNet = last.value * 0.94 - last.balance;
    flows[5] += saleNet;
    var irr = Fin.irr(flows);

    return {
      type: "rental", inputs: i, loan: loan, downAmt: downAmt, pmt: pm, ds: ds,
      gross: gross, vacancyLoss: vac, egi: egi, mgmtCost: mgmt, maintCost: maint, capexCost: capex,
      fixed: fixed, opex: opex, noi: noi, cfYear: cf, cfMonth: cf / 12, cash: cash,
      cap: i.price > 0 ? noi / i.price : 0, coc: cash > 0 ? cf / cash : 0, dscr: ds > 0 ? noi / ds : Infinity,
      beOcc: beOcc, onePct: i.price > 0 ? i.rent / i.price : 0, grm: gross > 0 ? i.price / gross : 0,
      yieldOnPrice: i.price > 0 ? noi / i.price : 0, projection: years, irr: irr, saleNet: saleNet,
      revenueLabel: "Rent", lines: [
        ["Gross scheduled rent", gross], ["Vacancy", -vac], ["Effective gross income", egi, "sub"],
        ["Property taxes", -i.taxes], ["Insurance", -i.insurance], ["HOA, utilities, other", -(i.hoa + i.utilities + i.otherExp) * 12],

      ]

    adr: 245, occupancy: 62, avgStay: 3.5, cleanFee: 140, cleanCost: 110, platform: 3, mgmt: 0,
    supplies: 6, taxes: 5200, insurance: 3400, hoa: 380, utilities: 310, internet: 80, otherExp: 60,
    maint: 5, capex: 5, ltrRent: 2300, season: "beach"
  };

  function str(raw) {
    var i = {}; for (var k in STR_DEFAULTS) i[k] = k === "season" ? (raw[k] || STR_DEFAULTS[k]) : num(raw[k], STR_DEFAULTS[k]);
    function core(occ, adr) {
      var nights = 365 * occ / 100, stays = i.avgStay > 0 ? nights / i.avgStay : 0;
      var rentRev = adr * nights, cleanRev = i.cleanFee * stays, gross = rentRev + cleanRev;

      if (!st) setMode("demo", true);
      render(); if (x) offerImport(x); else toast("That share link is damaged or incomplete."); return;
    }
    if (h === "#demo") { if (mode !== "demo" || !st) setMode("demo", !st); try { history.replaceState(null, "", location.pathname + location.search + "#dashboard"); } catch (e) { } }
    if (h !== "#learn") ui.lesson = null; render();
  });

  render();
  if (/^#(welcome|demo|start|import=)/.test(location.hash)) { try { history.replaceState(null, "", location.pathname + location.search + (st ? "#dashboard" : "")); } catch (e) { } }
  if (pendingImport) { if (st) offerImport(pendingImport); }
  else if (importBad) toast("That share link is damaged or incomplete.");
})();

</script>
