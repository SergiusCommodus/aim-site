<style>
/* AIM brand system. White base, AIM navy (#183364) as the accent and header color. Single light theme by design. */
:root{
  --paper:#FFFFFF; --panel:#FFFFFF; --wash:#F5F7FB; --ink:#0F1E3A; --muted:#55617A; --faint:#7A859B; --line:#DDE3EC; --line-2:#C8D1DF;
  --accent:#183364; --tint:#EDF1F8; --tint-2:#DCE5F3; --navy:#183364; --navy-deep:#102650;
  --on-navy:#FFFFFF; --on-navy-muted:#B8C5DE; --sky:#9DB9EA;
  --good:#1E7A4C; --good-bg:#E5F3EB; --warn:#9A5B0E; --warn-bg:#FBF0DF; --bad:#B23434; --bad-bg:#FBE7E7;
  --c1:#2F5DAA; --c2:#4FA3E0; --c3:#C9902A; --c4:#1F9E89; --c5:#9B5BB4; --c6:#C2602F;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(15,30,58,.06),0 8px 24px -16px rgba(15,30,58,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);margin:0}
h1,h2,h3,h4{font-family:var(--display);font-stretch:112%;text-wrap:balance;margin:0;line-height:1.1}
h1,h2{font-style:italic;font-weight:800;letter-spacing:-.01em}
h3{font-weight:700}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.num,.tab-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--on-navy)}
.brand img{height:24px;width:auto;display:block}
.brand small{font:400 12px/1.2 var(--body);color:var(--on-navy-muted);padding-left:12px;border-left:1px solid rgba(255,255,255,.22)}
.topnav{display:flex;align-items:center;gap:22px}
.topnav a{color:var(--on-navy-muted);text-decoration:none;font-size:14px}
.topnav a:hover,.topnav a[aria-current="page"]{color:var(--on-navy)}
@media (max-width:820px){.topnav a.hide-sm{display:none}}
@media (max-width:440px){.brand small{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 15px/1 var(--body);padding:12px 18px;border-radius:6px;text-decoration:none;background:var(--navy);color:var(--on-navy);white-space:nowrap}
.btn:hover{background:var(--navy-deep);color:var(--on-navy)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--navy);color:var(--navy)}
.btn.light{background:var(--on-navy);color:var(--navy)}
.btn.light:hover{background:var(--sky);color:var(--navy)}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);color:#fff}
.btn.link{background:none;color:var(--accent);padding:6px 4px;font-weight:500}
.btn.link:hover{text-decoration:underline;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
label{font-size:13.5px;color:var(--muted)}
input,select,textarea{font:400 15px/1.3 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tint-2);border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--navy)}
input[type=range]{padding:0;border:0;accent-color:var(--navy)}

/* tags and pills */
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--tint);color:var(--accent);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--tint);color:var(--accent)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.footer{border-top:1px solid var(--line);padding-block:32px 40px;font-size:13.5px;color:var(--muted)}
.footer .f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.footer nav{display:flex;flex-wrap:wrap;gap:18px}
.footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App layout: navy top bar, left rail navigation on white, content column. Rail becomes a scrolling tab row on phones. */
html,body{height:100%}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);background:var(--wash);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px);overflow:auto}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:500}
.rail a svg{width:18px;height:18px;flex:none}
.rail a:hover{background:var(--tint);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--paper);color:var(--navy);box-shadow:inset 3px 0 0 var(--navy),0 1px 2px rgba(15,30,58,.08)}
.rail .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--faint);line-height:1.5}
.main{min-width:0;padding:28px 32px 64px}
.ws{display:flex;align-items:center;gap:10px;color:var(--on-navy-muted);font-size:13.5px}
.ws .who{display:flex;align-items:center;gap:8px}
.ws .av{width:30px;height:30px;border-radius:50%;background:var(--on-navy);color:var(--navy);display:grid;place-items:center;font:700 13px var(--body)}
.sample{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.12);color:var(--on-navy);padding:6px 8px;border-radius:4px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail a{white-space:nowrap;padding:8px 10px;font-size:14px}
  .rail a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--navy)}
  .rail .sep,.rail .foot{display:none}
  .main{padding:20px 16px 56px}
  .ws .wsname{display:none}
}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.ph h1{font-size:clamp(26px,3vw,34px)}
.ph p{color:var(--muted);margin-top:6px}
.ph .actions{display:flex;flex-wrap:wrap;gap:8px}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>header h2,.card>header h3{font-size:16px;font-style:normal;font-weight:700;letter-spacing:0}
.card .body{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split-r{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* kpi */
.kpi{padding:16px 18px}
.kpi>small{display:block;font-size:13px;color:var(--muted)}
.kpi>strong{display:block;font:500 26px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;color:var(--ink)}
.kpi>span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--navy);border-color:var(--navy)}
.kpi.hero>small,.kpi.hero>span{color:var(--on-navy-muted)}
.kpi.hero>strong{color:var(--on-navy)}
.up{color:var(--good)}.dn{color:var(--bad)}
.kpi.hero .up{color:#9FE0BC}.kpi.hero .dn{color:#F4B1B1}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--wash)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--wash)}
tr.sub td{font-weight:600;background:var(--wash)}
tr.total td{font-weight:700;border-top:2px solid var(--navy)}
td input,td select{padding:7px 8px;font-size:14px}
.best{background:var(--good-bg)!important;color:var(--good);font-weight:600}

/* opportunity list */
.oname{display:flex;flex-direction:column;gap:2px;min-width:0}
.oname b{font-weight:600;color:var(--ink)}
.oname span{font-size:12.5px;color:var(--muted)}
.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font:600 14px var(--mono);border:3px solid currentColor}
.score.s-strong{color:var(--good)}.score.s-workable{color:var(--navy)}.score.s-marginal{color:var(--warn)}.score.s-weak{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--paper);color:var(--muted);border-radius:999px;padding:7px 12px;font:500 13.5px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* analyzer */
.an{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.an{grid-template-columns:1fr}}
.inputs{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1000px){.inputs{position:static;max-height:none}}
fieldset{border:0;padding:14px 18px;margin:0;border-bottom:1px solid var(--line)}
fieldset:last-child{border-bottom:0}
legend{font:500 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0;margin-bottom:10px;float:left;width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;clear:both}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.f label em{font-style:normal;color:var(--faint)}
.inwrap{position:relative}
.inwrap input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.inwrap.pre input{padding-left:22px}
.inwrap.post input{padding-right:34px}
.inwrap .u{position:absolute;top:50%;transform:translateY(-50%);font:400 13px var(--mono);color:var(--faint);pointer-events:none}
.inwrap.pre .u{left:10px}.inwrap.post .u{right:10px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:20px}
.dial{width:112px;height:112px}
.verdict h2{font-size:22px;font-style:normal;font-weight:800}
.verdict p{margin-top:6px;color:var(--ink)}
.verdict .tp{margin-top:10px;font-size:14px;color:var(--muted)}
.verdict .tp b{color:var(--navy);font-family:var(--mono)}
@media (max-width:520px){.verdict{grid-template-columns:1fr}}
.parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
.part{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.part:last-child{border-right:0}
.part small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part b{font:500 14px var(--mono)}
.meter{height:5px;border-radius:3px;background:var(--tint);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy);border-radius:3px}
@media (max-width:700px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}.part{border-bottom:1px solid var(--line)}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.m{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.m:nth-child(4n){border-right:0}
.m>small{display:block;font-size:12.5px;color:var(--muted)}
.m>strong{display:block;font:500 19px/1.3 var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.m>span{display:block;font-size:11.5px;color:var(--faint)}
@media (max-width:700px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.m:nth-child(4n){border-right:1px solid var(--line)}.m:nth-child(2n){border-right:0}}
.flag{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.flag .sev{width:9px;height:9px;border-radius:50%;margin-top:7px}
.sev.high{background:var(--bad)}.sev.med{background:var(--warn)}.sev.info{background:var(--c2)}
.flag b{font-weight:600}
.flag p{font-size:14px;color:var(--muted)}
.flag p.act{color:var(--ink);margin-top:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font:600 14.5px var(--body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.title-in{font:italic 800 clamp(24px,3vw,32px)/1.15 var(--display);font-stretch:112%;border:1px solid transparent;padding:2px 6px;margin-left:-7px;border-radius:6px;background:transparent;width:100%;max-width:640px}
.title-in:hover{border-color:var(--line)}
.status-sel{width:auto;padding:7px 10px;font-size:14px}

/* charts */
.chart{display:block;overflow:visible;max-width:100%}
.chart text{font:400 11px var(--mono);fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis line{stroke:var(--line-2)}
.cwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:400 12.5px/1.4 var(--body);padding:7px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.tip b{font-family:var(--mono);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--paper)}
.alloc i{display:block;height:100%}
.tornado .row{display:grid;grid-template-columns:170px 1fr 92px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.tornado .bar{position:relative;height:14px}
.tornado .bar .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-2)}
.tornado .bar i{position:absolute;top:0;height:100%;border-radius:3px}
.tornado .bar i.neg{background:var(--c6)}.tornado .bar i.pos{background:var(--c1)}
@media (max-width:560px){.tornado .row{grid-template-columns:110px 1fr 70px;font-size:12.5px}}

/* progress */
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.goal .top b{font-weight:600}
.bar-p{height:8px;background:var(--tint);border-radius:4px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--navy);border-radius:4px}
.goal small{color:var(--muted);font-size:12.5px}

/* attention list */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 18px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att p{font-size:13.5px;color:var(--muted)}
.att b{font-weight:600;font-size:14.5px}

/* modal and toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,58,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--paper);border-radius:12px;max-width:560px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);max-height:calc(100vh - 32px);overflow:auto}
.modal header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:20px}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.types label{border:1px solid var(--line-2);border-radius:8px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.types label:has(input:checked){border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--tint)}
.types label b{font-size:14.5px}
.types label span{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.types{grid-template-columns:1fr}}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{background:var(--wash)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;z-index:70;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border:1px solid var(--tint-2);border-left:4px solid var(--navy);border-radius:var(--r);padding:12px 16px;margin-bottom:22px;font-size:14px}

/* bot */
.chat{display:flex;flex-direction:column;height:min(70vh,720px)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:11px 14px;border-radius:12px;font-size:14.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--wash);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot b{color:var(--navy)}
.msg ul{margin:6px 0 0;padding-left:18px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
@media (max-width:640px){.msg{max-width:92%}}

/* learn */
.lesson{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit}
.lesson:hover{border-color:var(--navy)}
.lesson h3{font-size:16px}
.lesson p{font-size:13.5px;color:var(--muted)}
.lesson .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--faint)}
.lesson.done{background:var(--wash)}
.formula{font:500 14px/1.6 var(--mono);background:var(--wash);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:6px;padding:12px 14px;overflow-x:auto}
.prose p+p{margin-top:12px}
.prose{max-width:68ch}

/* report */
.doc{max-width:820px;padding:36px 40px}
.doc h2{font-size:28px;margin-top:6px}
.doc h3{font-size:15px;font-style:normal;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}
.doc ul{padding-left:20px;margin:0}
.doc li+li{margin-top:4px}
@media (max-width:640px){.doc{padding:22px 18px}}

/* gate */
.gate{max-width:560px;margin:8vh auto;text-align:center;padding:36px 28px}
.gate h1{font-size:30px;margin-top:14px}
.gate p{color:var(--muted);margin-top:12px}
.gate .actions{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

</style>
</head>

/* AIM financial engine. Pure functions, no DOM. The model calculates; the UI and AIMBot only explain. */
var AIM = (function () {
  "use strict";

  function num(v, d) { v = +v; return isFinite(v) ? v : (d || 0); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  var Fin = {
    pmt: function (loan, ratePct, years) {
      var r = ratePct / 1200, n = Math.round(years * 12);
      if (loan <= 0 || n <= 0) return 0;
      return r === 0 ? loan / n : loan * r / (1 - Math.pow(1 + r, -n));
    },
    balance: function (loan, ratePct, years, months) {

      var r = ratePct / 1200, n = Math.round(years * 12), p = Fin.pmt(loan, ratePct, years);

      return Math.max(0, loan * Math.pow(1 + r, months) - p * (Math.pow(1 + r, months) - 1) / r);

    npv: function (rate, flows) {

      for (var t = 0; t < flows.length; t++) s += flows[t] / Math.pow(1 + rate, t);

  var GLOSSARY = [
    { re: /\bdscr\b|debt service coverage|debt coverage|coverage ratio/, id: "dscr" },
    { re: /cap rate|capitalization/, id: "cap" },
    { re: /cash on cash|coc\b/, id: "coc" },
    { re: /break ?even/, id: "be" },
    { re: /\bsde\b|seller discretionary|discretionary earnings/, id: "sde" },
    { re: /multiple|valuation/, id: "mult" },
    { re: /add ?backs?/, id: "addbacks" },
    { re: /vacancy|reserve for repairs|capex|capital reserve/, id: "reserves" },
    { re: /occupancy|nightly rate|\badr\b/, id: "str" },
    { re: /emergency|reserve/, id: "efund" },
    { re: /savings rate|readiness/, id: "ready" },
    { re: /depreciation|tax/, id: "tax" },
    { re: /\bnoi\b|net operating income/, id: "noi" },
    { re: /\birr\b|internal rate|annualized/, id: "irr" }
  ];
  var EXTRA = {
    noi: "Net operating income is everything the asset earns minus every operating cost, before the loan. It is the income the property or business produces on its own, no matter how it is financed.",
    irr: "Internal rate of return is the annualized return over a full hold, counting yearly cash flow, loan paydown, appreciation, and the sale. AIM models a five year hold with 6% selling costs."
  };

  function explain(id, ctx, opp) {
    var l = LESSONS.filter(function (x) { return x.id === id; })[0];
    var text = l ? l.body[0] : EXTRA[id];
    var out = "<p>" + text + "</p>";
    if (l && l.formula) out += "<p><b>" + l.formula + "</b></p>";
    if (opp) {
      var r = AIM.run(opp.type, opp.inputs);
      var v = { dscr: "Coverage on " + opp.name + " is <b>" + R(r.dscr) + "</b>.", cap: "Cap rate on " + opp.name + " is <b>" + P(r.cap) + "</b>.",
        coc: "Cash on cash on " + opp.name + " is <b>" + P(r.coc) + "</b>.", noi: "Net operating income on " + opp.name + " is <b>" + M(r.noi) + "</b> a year.",
        be: r.beOcc != null && opp.type !== "business" ? opp.name + " breaks even at <b>" + P(r.beOcc, 0) + "</b> occupancy." : "",
        irr: r.irr != null ? "The five year return on " + opp.name + " is <b>" + P(r.irr) + "</b> a year." : "",

      if (v) out += "<p>" + v + "</p>";

  function list(items) { return "<ul>" + items.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"; }

  function answer(q, ctx, opp) {
    var s = q.toLowerCase().trim();
    var asking = /^(what|whats|what's|explain|define|how does|how is|meaning|tell me about)\b|\bmean\b|\bdefinition\b/.test(s);
    var g = GLOSSARY.filter(function (x) { return x.re.test(s); })[0];
    if (g && asking) return explain(g.id, ctx, opp);

    var evals = ctx.opps.filter(function (o) { return o.status === "Evaluating"; });
    function need() { return "<p>Pick an opportunity in the menu above and I will answer using its numbers.</p>"; }

    if (/compare|which (deal|one|opportunity)|best (deal|opportunity|option)|rank/.test(s)) {
      if (!evals.length) return "<p>You have no opportunities under evaluation yet. Start one from Opportunities.</p>";
      var ranked = evals.map(function (o) { return { o: o, sc: AIM.score(o.type, o.inputs, ctx) }; }).sort(function (a, b) { return b.sc.total - a.sc.total; });
      return "<p>Ranked by AIM Score against your targets:</p>" + list(ranked.map(function (x) { return "<b>" + x.o.name + "</b>: " + x.sc.total + " (" + x.sc.grade + "), " + M(x.sc.r.cfYear) + " a year on " + M(x.sc.r.cash) + " invested"; })) +
        "<p>" + ranked[0].o.name + " leads. Check its downside case before acting.</p>";
    }
    if (/drive|matter|sensitiv|biggest|most impact|lever|assumption/.test(s)) {
      if (!opp) return need();
      var sn = AIM.sensitivity(opp.type, opp.inputs).slice(0, 3);
      return "<p>The three assumptions that move " + opp.name + " the most:</p>" + list(sn.map(function (x) { return "<b>" + x.label + "</b> (" + x.swing + ") changes yearly cash flow by about " + M(x.impact); })) + "<p>Verify these first. They matter more than everything else combined.</p>";
    }
    if (/risk|worry|red flag|concern|wrong|problem|issue/.test(s)) {
      if (!opp) return need();
      var f = AIM.score(opp.type, opp.inputs, ctx).flags;
      if (!f.length) return "<p>No risk flags on " + opp.name + " at current assumptions. That only means the inputs pass. The inputs still need to be verified.</p>";
      return "<p>Flags on " + opp.name + ":</p>" + list(f.map(function (x) { return "<b>" + x.title + ".</b> " + x.action; }));
    }
    if (/offer|what should i pay|price|negotiat|target|pay for/.test(s)) {
      if (!opp) return need();
      var t = AIM.targetPrice(opp.type, opp.inputs, ctx.settings), p = AIM.run(opp.type, opp.inputs).inputs.price;
      if (t == null) return "<p>No price in a reasonable range gets " + opp.name + " to a " + ctx.settings.minDscr.toFixed(2) + " coverage and " + ctx.settings.minCoc + "% return. The income or terms need to change.</p>";
      return "<p>At your targets of " + ctx.settings.minDscr.toFixed(2) + " coverage and " + ctx.settings.minCoc + "% cash on cash, the most you should pay for " + opp.name + " is about <b>" + M(t) + "</b>. The asking price is " + M(p) + (t >= p ? ", so the deal already meets your criteria." : ", a gap of " + M(p - t) + ".") + "</p>";
    }
    if (/ready|afford|enough (cash|money)|can i buy|down payment/.test(s)) {
      if (!opp) return need();
      var rr = AIM.run(opp.type, opp.inputs), b = AIM.budget(ctx.budget), gap = rr.cash - ctx.available;
      if (gap <= 0) return "<p>Yes. " + opp.name + " needs " + M(rr.cash) + " and you have " + M(ctx.available) + " available after your " + M(ctx.reserve) + " reserve. You would keep " + M(-gap) + " beyond it.</p>";
      return "<p>Not yet. " + opp.name + " needs " + M(rr.cash) + " and you have " + M(ctx.available) + " after your reserve, a gap of <b>" + M(gap) + "</b>." + (b.fcf > 0 ? " At " + M(b.fcf) + " a month of free cash flow, that is about " + Math.ceil(gap / b.fcf) + " months." : " Your budget has no free cash flow right now.") + "</p>";
    }
    if (/downside|worst|recession|stress|bad year|scenario/.test(s)) {
      if (!opp) return need();
      var sc = AIM.scenarios(opp.type, opp.inputs);
      return "<p>" + opp.name + " across three cases:</p>" + list(sc.map(function (x) { return "<b>" + x.name + "</b>: " + M(x.r.cfYear) + " a year, coverage " + R(x.r.dscr) + (x.note ? " (" + x.note.toLowerCase() + ")" : ""); }));
    }
    if (/summar|overview|thesis|tell me about|how does .* look|how is/.test(s)) {
      if (!opp) return need();
      var sc2 = AIM.score(opp.type, opp.inputs, ctx), t2 = AIM.targetPrice(opp.type, opp.inputs, ctx.settings);
      return "<p><b>" + opp.name + "</b> scores " + sc2.total + " (" + sc2.grade + "). It needs " + M(sc2.r.cash) + " and produces " + M(sc2.r.cfYear) + " a year, a " + P(sc2.r.coc) + " cash on cash return with " + R(sc2.r.dscr) + " coverage.</p><p>" + AIM.recommendation(sc2, t2) + "</p>";
    }
    if (/budget|spend|expense|saving/.test(s)) {
      var bb = AIM.budget(ctx.budget);
      return "<p>You bring in " + M(bb.income) + " a month and spend " + M(bb.expenses) + ", leaving " + M(bb.fcf) + " of free cash flow. That is a " + P(bb.savingsRate, 0) + " savings rate.</p>";
    }
    if (/net worth|worth|wealth/.test(s)) return "<p>Your net worth is <b>" + M(ctx.netWorth) + "</b>, including " + M(ctx.ownedEquity) + " of equity in assets you own.</p>";
    if (g) return explain(g.id, ctx, opp);
    return "<p>I answer questions about your numbers. Try one of these:</p>" + list(["What drives this deal?", "What should I offer?", "Am I ready to buy it?", "What are the risks?", "Explain DSCR", "Compare my deals"]);
  }

  return { LESSONS: LESSONS, answer: answer };
})();

    if (ui.lesson) {
      var l = L.filter(function (x) { return x.id === ui.lesson; })[0], ex = l.ex(ctx());
      return '<div style="margin-bottom:6px"><button class="btn sm link" style="padding-left:0" data-act="lesson" data-id="">← All lessons</button></div><article class="card doc"><span class="eyebrow">' + l.track + " · " + l.mins + " min</span><h2>" + l.title + '</h2><div class="prose" style="margin-top:18px">' + l.body.map(function (p) { return "<p>" + p + "</p>"; }).join("") + '</div><h3>Formula</h3><div class="formula">' + l.formula + "</div>" + (ex ? "<h3>With your numbers</h3><p>" + esc(ex) + "</p>" : "") +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px">' + (done.indexOf(l.id) < 0 ? '<button class="btn" data-act="lesson-done" data-id="' + l.id + '">Mark complete</button>' : '<span class="pill good">Completed</span>') + (l.open ? '<a class="btn ghost" href="#' + (l.open === "budget" ? "budget" : "opportunities") + '">Try it in AIM</a>' : "") + "</div></article>";
    }
    var tracks = []; L.forEach(function (x) { if (tracks.indexOf(x.track) < 0) tracks.push(x.track); });
    var pctDone = done.filter(function (d) { return L.some(function (x) { return x.id === d; }); }).length / L.length;
    var h = '<div class="ph"><div><h1>AIM Learning</h1><p>Short lessons that use your own numbers, so each idea sticks.</p></div><div style="min-width:220px"><div class="goal" style="border:0;padding:0"><div class="top"><b>Progress</b><span class="num">' + Math.round(pctDone * 100) + '%</span></div><div class="bar-p"><i style="width:' + (pctDone * 100).toFixed(0) + '%"></i></div></div></div></div>';
    tracks.forEach(function (t) {
      h += '<h2 style="font-size:18px;margin:22px 0 12px">' + t + '</h2><div class="grid g3">' + L.filter(function (x) { return x.track === t; }).map(function (x) {
        var d = done.indexOf(x.id) >= 0; return '<button class="lesson' + (d ? " done" : "") + '" data-act="lesson" data-id="' + x.id + '"><h3>' + x.title + "</h3><p>" + x.summary + '</p><span class="meta"><span>' + x.mins + " min</span>" + (d ? '<span class="pill good">Done</span>' : "<span>Start</span>") + "</span></button>";
      }).join("") + "</div>";
    });
    return h;
  };

  VIEWS.settings = function () {
    var s = st.settings;
    var h = '<div class="ph"><div><h1>Settings</h1><p>Your targets drive every AIM Score, target price, and risk flag.</p></div></div><div class="grid g2" style="align-items:start"><section class="card"><header><h2>Profile and targets</h2></header><div class="body"><div class="fg">' +
      '<div class="f full"><label for="s-name">First name</label><input id="s-name" value="' + esc(s.name) + '" data-set="name"></div>' +
      '<div class="f"><label for="s-coc">Minimum cash on cash</label><div class="inwrap post"><input id="s-coc" type="number" step="0.5" value="' + s.minCoc + '" data-set="minCoc"><span class="u">%</span></div></div>' +
      '<div class="f"><label for="s-dscr">Minimum DSCR</label><input id="s-dscr" type="number" step="0.05" value="' + s.minDscr + '" data-set="minDscr"></div>' +
      '<div class="f"><label for="s-res">Emergency reserve</label><div class="inwrap post"><input id="s-res" type="number" step="1" value="' + s.reserveMonths + '" data-set="reserveMonths"><span class="u">mos</span></div></div></div></div></section>';
    h += '<section class="card"><header><h2>Workspace</h2></header><div class="body" style="display:flex;flex-direction:column;gap:14px"><p class="muted" style="font-size:14px">Your workspace is saved in this browser on this device. It is not sent to AIM servers during the beta.</p>' +
      '<div class="confirm" id="resetRow"><button class="btn ghost" data-act="ask-reset" data-v="sample">Reload the sample portfolio</button><button class="btn ghost" data-act="ask-reset" data-v="empty">Start an empty workspace</button></div><div id="confirmSlot"></div></div></section></div>';
    return h;
  };

  /* ---------- modal ---------- */
  function modal(html) { var d = document.createElement("div"); d.className = "scrim"; d.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + "</div>"; document.body.appendChild(d); d.addEventListener("click", function (e) { if (e.target === d || e.target.closest("[data-close]")) d.remove(); }); var f = d.querySelector("input,button"); if (f) f.focus(); return d; }
  function toast(t) { var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }
  function newOpp() {
    var d = modal('<header><h2>New analysis</h2><button class="x" data-close aria-label="Close">×</button></header><form id="newForm"><div class="body"><fieldset style="padding:0;border:0"><legend class="sr">Type</legend><div class="types">' +
      [["rental", "Long term rental", "Single family, duplex, small multifamily"], ["str", "Short term rental", "Vacation homes and Airbnb style units"], ["business", "Business", "Laundromats, services, routes, and more"]].map(function (t, i) { return '<label><input type="radio" name="t" value="' + t[0] + '"' + (i === 0 ? " checked" : "") + ' class="sr"><b>' + t[1] + "</b><span>" + t[2] + "</span></label>"; }).join("") +
      '</div></fieldset><div class="f"><label for="nName">Name</label><input id="nName" required placeholder="123 Main St or the business name"></div><div class="f"><label for="nLoc">Location</label><input id="nLoc" placeholder="City, state"></div><p class="muted" style="font-size:13px">AIM starts you with typical assumptions. Replace them with real numbers as you get them.</p></div><footer><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Create analysis</button></footer></form>');
    $("#newForm", d).addEventListener("submit", function (e) {
      e.preventDefault(); var t = $("input[name=t]:checked", d).value, n = $("#nName", d).value.trim();
      if (!n) { $("#nName", d).focus(); return; }
      var o = { id: uid(), type: t, name: n, location: $("#nLoc", d).value.trim(), status: "Evaluating", created: NOW, notes: "", inputs: Object.assign({}, AIM.DEFAULTS[t]) };
      st.opps.unshift(o); save(); d.remove(); ui.tab = "analysis"; go("opp-" + o.id);
    });
  }

  /* ---------- events ---------- */
  function findOpp() { var r = route(); return r.v === "opp" ? st.opps.filter(function (o) { return o.id === r.id; })[0] : null; }
  var refreshT;
  function refreshResults() {
    clearTimeout(refreshT); refreshT = setTimeout(function () { var o = findOpp(), el = $("#results"); if (o && el) { el.innerHTML = results(o); bindCharts(); } }, 120);
  }
  document.addEventListener("input", function (e) {
    var t = e.target, o, d = t.dataset;
    if (d.field && (o = findOpp())) { o.inputs[d.field] = t.tagName === "SELECT" ? t.value : num(t.value); save(); refreshResults(); return; }
    if (d.meta && (o = findOpp())) { if (d.meta !== "status") { o[d.meta] = t.value; save(); } return; }
    if (d.line) { var x = st.budget[d.line].filter(function (i) { return i.id === d.id; })[0]; if (x) { x[d.k] = d.k === "amount" ? num(t.value) : t.value; save(); } return; }
    if (d.goal) { var g = st.budget.goals.filter(function (i) { return i.id === d.goal; })[0]; if (g) { g[d.k] = d.k === "name" ? t.value : num(t.value); save(); } return; }
    if (d.acct) { var a = st.accounts.filter(function (i) { return i.id === d.acct; })[0]; if (a) { a[d.k] = d.k === "value" ? num(t.value) : t.value; save(); } return; }
    if (d.set) { st.settings[d.set] = d.set === "name" ? t.value : num(t.value); save(); return; }
    if (d.actId && (o = findOpp())) { var ac = o.owned.actuals.filter(function (i) { return i.id === d.actId; })[0]; if (ac) { ac[d.k] = d.k === "revenue" || d.k === "expenses" ? num(t.value) : t.value; save(); } return; }
    if (d.own && (o = findOpp())) { o.owned[d.own] = d.own === "value" ? num(t.value) : t.value; save(); return; }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, d = t.dataset, o;
    if (t.id === "botOpp") { ui.chatOpp = t.value || ""; return; }
    if (d.meta === "status" && (o = findOpp())) {
      o.status = t.value; if (o.status === "Owned" && !o.owned) o.owned = { since: NOW, value: AIM.run(o.type, o.inputs).inputs.price, actuals: [] };
      save(); toast("Marked as " + o.status); render(); return;
    }
    if (d.line || d.goal || d.acct || d.actId || d.own || d.set) later();
  });
  document.addEventListener("submit", function (e) { if (e.target.id === "botForm") { e.preventDefault(); var i = $("#botIn"); ask(i.value); } });
  document.addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-go]"); if (tr && !e.target.closest("a,button,input,select")) { go(tr.dataset.go); return; }
    var b = e.target.closest("[data-act]"); if (!b) return; var a = b.dataset.act, o = findOpp();
    switch (a) {
      case "new-opp": newOpp(); break;
      case "welcomed": st.welcomed = true; save(); render(); break;
      case "filter": ui.filter = b.dataset.v; render(); break;
      case "tab": ui.tab = b.dataset.v; render(); break;
      case "dup": var src = st.opps.filter(function (x) { return x.id === b.dataset.id; })[0], cp = JSON.parse(JSON.stringify(src)); cp.id = uid(); cp.name = src.name + " (copy)"; cp.status = "Evaluating"; delete cp.owned; st.opps.unshift(cp); save(); toast("Duplicated"); go("opp-" + cp.id); break;
      case "del":
        var dm = modal('<header><h2>Delete this analysis?</h2><button class="x" data-close aria-label="Close">×</button></header><div class="body"><p>' + esc(o.name) + ' and any logged months will be removed from this workspace. This cannot be undone.</p></div><footer><button class="btn ghost" data-close>Keep it</button><button class="btn danger" id="yesDel">Delete</button></footer>');
        $("#yesDel", dm).addEventListener("click", function () { st.opps = st.opps.filter(function (x) { return x.id !== o.id; }); save(); dm.remove(); toast("Deleted"); go("opportunities"); });
        break;
      case "add-actual": var last = (o.owned.actuals || []).map(function (x) { return x.month; }).sort().pop(); var p = ownedPerf(o); o.owned.actuals.push({ id: uid(), month: last ? addMonths(last, 1) : NOW, revenue: Math.round(p.planRev), expenses: Math.round(p.planExp), note: "" }); save(); render(); break;
      case "del-actual": o.owned.actuals = o.owned.actuals.filter(function (x) { return x.id !== b.dataset.id; }); save(); render(); break;
      case "copy-report":
        var txt = reportPlain(st.opps.filter(function (x) { return x.id === b.dataset.id; })[0]);
        try { navigator.clipboard.writeText(txt).then(function () { toast("Summary copied"); }, function () { fallbackCopy(txt); }); } catch (err) { fallbackCopy(txt); }
        break;
      case "cmp": var id = b.dataset.id, i = ui.compare.indexOf(id); if (i >= 0) ui.compare.splice(i, 1); else { if (ui.compare.length >= 3) ui.compare.shift(); ui.compare.push(id); } render(); break;
      case "add-line": st.budget[b.dataset.k].push(b.dataset.k === "income" ? { id: uid(), name: "New income", amount: 0 } : { id: uid(), name: "New expense", amount: 0, kind: "Variable" }); save(); render(); break;
      case "del-line": st.budget[b.dataset.k] = st.budget[b.dataset.k].filter(function (x) { return x.id !== b.dataset.id; }); save(); render(); break;
      case "add-goal": st.budget.goals.push({ id: uid(), name: "New goal", target: 10000, saved: 0, monthly: 250 }); save(); render(); break;
      case "del-goal": st.budget.goals = st.budget.goals.filter(function (x) { return x.id !== b.dataset.id; }); save(); render(); break;
      case "add-acct": st.accounts.push({ id: uid(), name: "New account", type: "Cash", value: 0 }); save(); render(); break;
      case "del-acct": st.accounts = st.accounts.filter(function (x) { return x.id !== b.dataset.id; }); save(); render(); break;
      case "snapshot": var v = Math.round(netWorthOf(st).total), hh = st.history.filter(function (x) { return x.month === NOW; })[0]; if (hh) hh.value = v; else st.history.push({ month: NOW, value: v }); save(); toast("Recorded " + M(v) + " for " + ymLabel(NOW)); render(); break;
      case "ask": ask(b.dataset.q); break;
      case "lesson": ui.lesson = b.dataset.id || null; render(); break;
      case "lesson-done": st.lessonsDone = (st.lessonsDone || []).concat([b.dataset.id]); save(); toast("Lesson complete"); render(); break;
      case "ask-reset":
        var kind = b.dataset.v; $("#confirmSlot").innerHTML = '<div class="banner" style="margin:0"><span>' + (kind === "sample" ? "Replace everything with the sample portfolio?" : "Clear every opportunity, account, and goal?") + ' This cannot be undone.</span><span class="confirm"><button class="btn sm ghost" data-act="cancel-reset">Cancel</button><button class="btn sm danger" data-act="do-reset" data-v="' + kind + '">Yes, continue</button></span></div>'; break;
      case "cancel-reset": $("#confirmSlot").innerHTML = ""; break;
      case "do-reset": var nm = st.settings.name; st = b.dataset.v === "sample" ? seed(nm) : emptyWs(nm); if (b.dataset.v === "sample") st.welcomed = true; ui.compare = []; ui.chat = []; ui.chatOpp = null; store(KEY, st); toast(b.dataset.v === "sample" ? "Sample portfolio loaded" : "Workspace cleared"); go("dashboard"); break;
    }
  });
  function fallbackCopy(t) { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Summary copied"); } catch (e) { toast("Select the summary text to copy it"); } ta.remove(); }
  window.addEventListener("hashchange", function () { if (location.hash !== "#learn") ui.lesson = null; render(); });

  render();
  if (cameFromDemo) { try { history.replaceState(null, "", location.pathname + location.search + "#dashboard"); } catch (e) { } }
})();

</script>
</body>
</html>
